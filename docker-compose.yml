services:
  # PostgreSQL con TimescaleDB
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: petro-db
    environment:
      POSTGRES_USER: petro
      POSTGRES_PASSWORD: petro_dev_password
      POSTGRES_DB: petro_dev
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petro"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - petro-network

  # Redis
  redis:
    image: redis:7.2-alpine
    container_name: petro-redis
    command: redis-server --appendonly yes --maxmemory 8gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - petro-network

  # MLflow server (tracking & model registry)
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: petro-mlflow
    environment:
      BACKEND_STORE_URI: postgresql://petro:petro_dev_password@db:5432/mlflow
      DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    ports:
      - "7500:5000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      mlflow server
      --backend-store-uri postgresql://petro:petro_dev_password@db:5432/mlflow
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
    networks:
      - petro-network

  # Elasticsearch (ELK stack)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: petro-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms4g -Xmx4g"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: curl -s http://localhost:9200 >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - petro-network

  # Kibana (ELK visualization)
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: petro-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - petro-network

  # Logstash (ELK log processing)
  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.0
    container_name: petro-logstash
    volumes:
      - ./infra/docker/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    environment:
      - "LS_JAVA_OPTS=-Xmx4g -Xms4g"
    ports:
      - "7700:5000"
      - "7701:9600"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - petro-network

  # Prometheus (metrics collection)
  prometheus:
    image: prom/prometheus:latest
    container_name: petro-prometheus
    volumes:
      - ./infra/docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "9090:9090"
    networks:
      - petro-network

  # Grafana (metrics visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: petro-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/docker/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./infra/docker/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - petro-network

  # FastAPI application
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
      args:
        PYTHON_VERSION: "3.12"
    container_name: petro-api
    environment:
      ENV: development
      DEBUG: "True"
      DATABASE__URL: postgresql+asyncpg://petro:petro_dev_password@db:5432/petro_dev
      REDIS__URL: redis://redis:6379/0
      CELERY__BROKER_URL: redis://redis:6379/1
      CELERY__RESULT_BACKEND: redis://redis:6379/2
      LOGGING__LEVEL: DEBUG
      LOGGING__FORMAT: json
      MLFLOW__TRACKING_URI: http://mlflow:7500
      MLFLOW__ARTIFACT_ROOT: /mlflow/artifacts
      API__HOST: 0.0.0.0
      API__PORT: 8000
      API__CORS_ORIGINS: '["http://localhost", "http://localhost:3000", "http://localhost:8000", "http://192.168.30.199:3010", "http://192.168.30.199:8000", "*"]'
      ML__MODEL_PATH: models/production/price_model.pkl
      ML__SCALER_PATH: models/production/scaler.pkl
      ML__PREDICTION_HORIZON_DAYS: 7
      NLP__MODEL_SIZE: full
      NLP__ENABLE_TRANSFORMERS: "True"
      NLP__BERT_MODEL: bert-base-multilingual-cased
      NLP__EMBEDDING_MODEL: sentence-transformers/all-MiniLM-l12-v2
      GPU__ENABLE: "True"
      GPU__DEVICE: cuda:0
      GPU__MEMORY_FRACTION: "0.8"
      FEATURES__RECALC_INTERVAL_MINUTES: 15
      FEATURES__CACHE_TTL_SECONDS: 600
      PREDICTION__ENABLE_EXPLAINABILITY: "True"
      PREDICTION__BATCH_SIZE: 32
      CONNECTORS__BRENT_ENABLED: "True"
      CONNECTORS__WTI_ENABLED: "True"
      CONNECTORS__EURUSD_ENABLED: "True"
      CONNECTORS__GEOPORTAL_ENABLED: "True"
      CONNECTORS__RSS_NEWS_ENABLED: "True"
    volumes:
      - ./src:/app/src
      - ./models:/app/models
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn petro.api.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - petro-network

  # Celery worker
  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
      args:
        PYTHON_VERSION: "3.12"
    container_name: petro-worker
    environment:
      ENV: development
      DEBUG: "True"
      DATABASE__URL: postgresql+asyncpg://petro:petro_dev_password@db:5432/petro_dev
      REDIS__URL: redis://redis:6379/0
      CELERY__BROKER_URL: redis://redis:6379/1
      CELERY__RESULT_BACKEND: redis://redis:6379/2
      LOGGING__LEVEL: DEBUG
      LOGGING__FORMAT: json
      MLFLOW__TRACKING_URI: http://mlflow:7500
      MLFLOW__ARTIFACT_ROOT: /mlflow/artifacts
      API__HOST: 0.0.0.0
      API__PORT: 8000
      ML__MODEL_PATH: models/production/price_model.pkl
      ML__SCALER_PATH: models/production/scaler.pkl
      ML__PREDICTION_HORIZON_DAYS: 7
      NLP__MODEL_SIZE: full
      NLP__ENABLE_TRANSFORMERS: "True"
      NLP__BERT_MODEL: bert-base-multilingual-cased
      NLP__EMBEDDING_MODEL: sentence-transformers/all-MiniLM-l12-v2
      GPU__ENABLE: "True"
      GPU__DEVICE: cuda:0
      GPU__MEMORY_FRACTION: "0.8"
      FEATURES__RECALC_INTERVAL_MINUTES: 15
      FEATURES__CACHE_TTL_SECONDS: 600
      PREDICTION__ENABLE_EXPLAINABILITY: "True"
      PREDICTION__BATCH_SIZE: 32
      CONNECTORS__BRENT_ENABLED: "True"
      CONNECTORS__WTI_ENABLED: "True"
      CONNECTORS__EURUSD_ENABLED: "True"
      CONNECTORS__GEOPORTAL_ENABLED: "True"
      CONNECTORS__RSS_NEWS_ENABLED: "True"
    volumes:
      - ./src:/app/src
      - ./models:/app/models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A petro.scheduler.app worker --loglevel=info --concurrency=2
    networks:
      - petro-network

  # Celery beat (scheduler)
  beat:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.beat
      args:
        PYTHON_VERSION: "3.12"
    container_name: petro-beat
    environment:
      ENV: development
      DEBUG: "True"
      DATABASE__URL: postgresql+asyncpg://petro:petro_dev_password@db:5432/petro_dev
      REDIS__URL: redis://redis:6379/0
      CELERY__BROKER_URL: redis://redis:6379/1
      CELERY__RESULT_BACKEND: redis://redis:6379/2
      LOGGING__LEVEL: DEBUG
      LOGGING__FORMAT: json
      MLFLOW__TRACKING_URI: http://mlflow:7500
      MLFLOW__ARTIFACT_ROOT: /mlflow/artifacts
      API__HOST: 0.0.0.0
      API__PORT: 8000
      ML__MODEL_PATH: models/production/price_model.pkl
      ML__SCALER_PATH: models/production/scaler.pkl
      ML__PREDICTION_HORIZON_DAYS: 7
      NLP__MODEL_SIZE: full
      NLP__ENABLE_TRANSFORMERS: "True"
      NLP__BERT_MODEL: bert-base-multilingual-cased
      NLP__EMBEDDING_MODEL: sentence-transformers/all-MiniLM-l12-v2
      GPU__ENABLE: "True"
      GPU__DEVICE: cuda:0
      GPU__MEMORY_FRACTION: "0.8"
      FEATURES__RECALC_INTERVAL_MINUTES: 15
      FEATURES__CACHE_TTL_SECONDS: 600
      PREDICTION__ENABLE_EXPLAINABILITY: "True"
      PREDICTION__BATCH_SIZE: 32
      CONNECTORS__BRENT_ENABLED: "True"
      CONNECTORS__WTI_ENABLED: "True"
      CONNECTORS__EURUSD_ENABLED: "True"
      CONNECTORS__GEOPORTAL_ENABLED: "True"
      CONNECTORS__RSS_NEWS_ENABLED: "True"
    volumes:
      - ./src:/app/src
      - ./models:/app/models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A petro.scheduler.app beat --loglevel=info
    networks:
      - petro-network

  # Next.js Frontend Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: petro-frontend
    ports:
      - "3010:3010"
    environment:
      NEXT_PUBLIC_API_URL: http://192.168.30.199:8000
    depends_on:
      - api
    networks:
      - petro-network

volumes:
  postgres_data:
  redis_data:
  mlflow_artifacts:
  elasticsearch_data:
  prometheus_data:
  grafana_data:

networks:
  petro-network:
    driver: bridge
