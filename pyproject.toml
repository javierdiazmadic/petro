[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "petro"
version = "0.1.0"
description = "Sistema de predicción del precio de gasolina y gasóleo en España"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Javier Diaz", email = "javier.diaz@madic.com"}
]

dependencies = [
    # Web Framework
    "fastapi==0.110.3",
    "uvicorn[standard]==0.28.0",
    "pydantic==2.8.2",
    "pydantic-settings==2.3.0",

    # Async & HTTP
    "httpx==0.27.0",
    "aiohttp==3.10.0",
    "asyncpg==0.30.0",

    # Database & ORM
    "sqlalchemy==2.0.36",
    "psycopg[binary,pool]==3.20.0",
    "alembic==1.14.0",

    # Cache & Task Queue
    "redis==5.1.0",
    "celery==5.3.6",

    # Data Processing
    "pandas==2.2.3",
    "numpy==1.26.4",
    "polars==0.20.31",  # OLAP alternative
    "duckdb==0.10.3",  # In-process OLAP

    # ML & Data Science
    "scikit-learn==1.5.1",
    "xgboost==2.1.1",
    "lightgbm==4.2.0",
    "shap==0.46.0",
    "optuna==3.1.1",

    # GPU & Distributed
    "torch==2.4.1",  # GPU support
    "ray[tune,serve]==2.10.1",  # Distributed processing

    # NLP & Transformers
    "transformers==4.41.2",
    "sentence-transformers==3.0.1",
    "feedparser==6.0.11",
    "trafilatura==1.8.0",
    "beautifulsoup4==4.12.3",
    "lxml==4.9.4",
    "langdetect==1.0.9",
    "spacy==3.7.2",

    # ML Tracking
    "mlflow==2.13.0",

    # Monitoring & Logging
    "prometheus-fastapi-instrumentator==6.1.0",
    "python-json-logger==2.0.8",

    # Utilities
    "python-dotenv==1.0.1",
    "tenacity==8.3.0",
    "pytz==2024.1",
    "requests==2.32.3",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.3",
    "pytest-cov==4.1.0",
    "pytest-mock==3.14.0",
    "pytest-xdist==3.6.1",
    "black==24.3.0",
    "isort==5.13.2",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "pre-commit==3.7.0",
]

docker-dev = [
    "docker==7.1.0",
    "docker-compose==1.29.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 120
target-version = ["py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 120
skip_gitignore = true

[tool.ruff]
line-length = 120
target-version = "py312"
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --tb=short"
testpaths = ["tests"]
asyncio_mode = "auto"
