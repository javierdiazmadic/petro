[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "petro"
version = "0.1.0"
description = "Sistema de predicción del precio de gasolina y gasóleo en España"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Javier Diaz", email = "javier.diaz@madic.com"}
]

dependencies = [
    # Web Framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",

    # Async & HTTP
    "httpx>=0.27.0",
    "aiohttp>=3.10.0",
    "asyncpg>=0.30.0",

    # Database & ORM
    "sqlalchemy>=2.0.0",
    "psycopg[binary,pool]>=3.1.0",
    "alembic>=1.14.0",

    # Cache & Task Queue
    "redis>=5.0.0",
    "celery>=5.3.0",

    # Data Processing
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "polars>=0.20.0",
    "duckdb>=0.10.0",

    # ML & Data Science
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "shap>=0.44.0",
    "optuna>=3.0.0",

    # GPU & Distributed
    "torch>=2.0.0",

    # NLP & Transformers
    "transformers>=4.30.0",
    "sentence-transformers>=2.2.0",
    "feedparser>=6.0.0",
    "trafilatura>=1.6.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "langdetect>=1.0.9",
    "spacy>=3.5.0",

    # ML Tracking
    "mlflow>=2.0.0",

    # Monitoring & Logging
    "prometheus-fastapi-instrumentator>=6.0.0",
    "python-json-logger>=2.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "tenacity>=8.0.0",
    "pytz>=2024.0",
    "requests>=2.28.0",
    "schedule>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.3",
    "pytest-cov==4.1.0",
    "pytest-mock==3.14.0",
    "pytest-xdist==3.6.1",
    "black==24.3.0",
    "isort==5.13.2",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "pre-commit==3.7.0",
]

docker-dev = [
    "docker==7.1.0",
    "docker-compose==1.29.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 120
target-version = ["py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 120
skip_gitignore = true

[tool.ruff]
line-length = 120
target-version = "py312"
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --tb=short"
testpaths = ["tests"]
asyncio_mode = "auto"
