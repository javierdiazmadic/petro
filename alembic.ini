# Alembic Migration Configuration

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# Path to migration scripts
script_location = alembic

# Naming convention
sqlalchemy.url =

# Use table.c.<column_name> syntax
sqlalchemy.track_migrations = true

# File logging
logfilename = alembic.log

# Format
version_path_separator = :

# Migration script template
version_locations = %(here)s/alembic/versions

# Add in correct path to initdb
compare_type = false
compare_server_default = false
